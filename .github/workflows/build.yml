name: Crea app Windows e Android

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Versione
        run: |
          V="${GITHUB_REF_NAME#v}"; [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || V=$(node -p "require('./package.json').version")
          IFS=. read -r A B C <<< "$V"
          echo "APP_VERSION=$V" >> $GITHUB_ENV
          echo "APP_VERSION_CODE=$((A*10000 + B*100 + C))" >> $GITHUB_ENV
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Compila APK firmato
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          mkdir -p ../out
          if [ -n "$ANDROID_KEYSTORE_PASSWORD" ]; then
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk "../out/GiornateFonico-$APP_VERSION.apk"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "::error::Manca il secret ANDROID_KEYSTORE_PASSWORD"; exit 1
          else
            echo "::warning::Nessuna password di firma: creo solo una versione di prova"
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk "../out/GiornateFonico-$APP_VERSION-prova.apk"
          fi
      - uses: actions/upload-artifact@v4
        with: { name: android, path: out/*.apk }

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Versione
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"; [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || V=$(node -p "require('./package.json').version")
          echo "APP_VERSION=$V" >> $GITHUB_ENV
      - run: npm ci
      - run: npm run build
      - name: Prepara app desktop
        shell: bash
        env:
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: |
          cp -r www desktop/www
          node -e "const f='desktop/google.json';const g=require('./'+f);g.clientSecret=process.env.GOOGLE_DESKTOP_CLIENT_SECRET||'';require('fs').writeFileSync(f,JSON.stringify(g,null,2))"
          cd desktop && npm install --no-audit --no-fund && npm version "$APP_VERSION" --no-git-tag-version --allow-same-version
      - name: Crea installer
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis --publish never
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: desktop/dist/*.exe }

  # Pubblica una versione quando il messaggio del commit contiene [rilascio]
  release:
    needs: [android, windows]
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[rilascio]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versione
        run: echo "APP_VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Versione ${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          files: out/*
          body: |
            **Android:** scarica il file `.apk` dal telefono e aprilo per installare l'aggiornamento.
            **Windows:** scarica il file `.exe` e avvialo (se Windows avvisa: "Ulteriori informazioni" → "Esegui comunque").
